<!DOCTYPE html>
<html>
<head>
    <title>Reset Scrat Password</title>
</head>
<body>
    <h1>Password Reset für scrat</h1>
    <button id="resetBtn">Passwort auf "Alu123" setzen</button>
    <p id="status"></p>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, get, set } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        
        // Firebase Config laden
        import { firebaseConfig } from './firebase-config.js';
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + 'bingo_salt_2024');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        document.getElementById('resetBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Suche Benutzer "scrat"...';
            
            try {
                // Find scrat user
                const usersRef = ref(db, 'users');
                const snapshot = await get(usersRef);
                
                if (!snapshot.exists()) {
                    statusEl.textContent = 'Keine Benutzer gefunden!';
                    return;
                }
                
                const users = snapshot.val();
                let scratUserId = null;
                
                for (let userId in users) {
                    if (users[userId].username.toLowerCase() === 'scrat') {
                        scratUserId = userId;
                        break;
                    }
                }
                
                if (!scratUserId) {
                    statusEl.textContent = 'Benutzer "scrat" nicht gefunden!';
                    return;
                }
                
                statusEl.textContent = 'Benutzer gefunden! Setze neues Passwort...';
                
                // Hash new password
                const newPassword = 'Alu123';
                const hashedPassword = await hashPassword(newPassword);
                
                // Update password
                const passwordRef = ref(db, `users/${scratUserId}/password`);
                await set(passwordRef, hashedPassword);
                
                statusEl.textContent = '✅ Passwort erfolgreich geändert! Benutzer "scrat" kann sich jetzt mit Passwort "Alu123" anmelden.';
                statusEl.style.color = 'green';
                
            } catch (error) {
                console.error('Error:', error);
                statusEl.textContent = '❌ Fehler: ' + error.message;
                statusEl.style.color = 'red';
            }
        });
    </script>
</body>
</html>
